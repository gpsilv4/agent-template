version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      # Descomentar para LIGAR o auto-merge de patch/minor neste ecosystem
      # (ver .github/workflows/dependabot-auto-merge.yml — majors ficam sempre
      # para review humano). Requer branch protection em `main` com required
      # status checks; sem isso, nao ligar.
      # - automerge
    versioning-strategy: increase
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - ci
      # Descomentar para LIGAR o auto-merge de patch/minor neste ecosystem.
      # - automerge
    commit-message:
      prefix: ci
      include: scope
