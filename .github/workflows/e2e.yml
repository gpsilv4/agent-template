name: E2E Tests

on:
  # Manual trigger for on-demand runs
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against (leave empty for localhost)"
        required: false
        type: string

  # Uncomment to run on PRs to main:
  # pull_request:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  # Manual/on-demand runs (workflow_dispatch): NAO cancelar — dois dispatches com base_url
  # diferente na mesma ref nao se devem matar mutuamente.
  # SEM `github.run_id`: ele e unico por corrida, logo o grupo nunca tinha dois membros e o
  # bloco nao fazia nada — parecia proteger e nao protegia.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detects package.json AFTER checkout (job-level hashFiles is unreliable — runs pre-checkout).
  detect:
    name: Detect Project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_pkg: ${{ steps.check.outputs.has_pkg }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f package.json ]; then echo "has_pkg=true" >> "$GITHUB_OUTPUT"; else echo "has_pkg=false" >> "$GITHUB_OUTPUT"; fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_pkg == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # `cache: npm` ERRA (nao avisa — erra) quando nao ha lockfile, e o `setup-node`
          # rebenta com "Dependencies lock file is not found" antes de qualquer mensagem util.
          # O `ci.yml` ja tinha isto comentado; aqui estava ativo. Descomentar depois de
          # commitar o `package-lock.json`.
          # cache: npm

      # Guardado como no `ci.yml`: um `npm ci` nu falha com uma mensagem que nao aponta para a
      # causa, e num workflow de `workflow_dispatch` ninguem percebe porque. A mensagem aponta.
      - name: Install
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::error::package.json sem package-lock.json — corre 'npm install' e commita o lock (o CI usa 'npm ci'). Noutro gestor de pacotes, ajusta este passo e o 'cache:' acima."
            exit 1
          fi

      # NOTE: assumes Playwright. If your E2E runner differs (Cypress, WebdriverIO,
      # Vitest browser mode, …), replace this install step and the run commands below.
      - name: Install Playwright
        run: |
          if [ -d node_modules/@playwright/test ] || [ -d node_modules/playwright ]; then
            npx playwright install --with-deps chromium
          else
            echo "Playwright nao instalado — a saltar (outro runner de E2E?)"
          fi

      # Guardado como no `ci.yml`: um projeto sem este script levava `npm ERR! Missing
      # script` em vez de saltar. NOTA: o nome e `test:e2e`, nao `test` — a convencao
      # esmagadoramente comum e `test` = unitarios, e usar `test` aqui fazia o job "E2E"
      # correr os unitarios sem ninguem saber.
      - name: Run E2E Tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e']?0:1)"; then npm run test:e2e; else echo "No 'test:e2e' script — skipping"; fi
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || '' }}
          # Add test credentials as GitHub Secrets:
          # TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          # TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_pkg == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # `cache: npm` ERRA (nao avisa — erra) quando nao ha lockfile, e o `setup-node`
          # rebenta com "Dependencies lock file is not found" antes de qualquer mensagem util.
          # O `ci.yml` ja tinha isto comentado; aqui estava ativo. Descomentar depois de
          # commitar o `package-lock.json`.
          # cache: npm

      # Guardado como no `ci.yml`: um `npm ci` nu falha com uma mensagem que nao aponta para a
      # causa, e num workflow de `workflow_dispatch` ninguem percebe porque. A mensagem aponta.
      - name: Install
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::error::package.json sem package-lock.json — corre 'npm install' e commita o lock (o CI usa 'npm ci'). Noutro gestor de pacotes, ajusta este passo e o 'cache:' acima."
            exit 1
          fi

      # NOTE: assumes Playwright. If your E2E runner differs (Cypress, WebdriverIO,
      # Vitest browser mode, …), replace this install step and the run commands below.
      - name: Install Playwright
        run: |
          if [ -d node_modules/@playwright/test ] || [ -d node_modules/playwright ]; then
            npx playwright install --with-deps chromium
          else
            echo "Playwright nao instalado — a saltar (outro runner de E2E?)"
          fi

      - name: Run Security Tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:security']?0:1)"; then npm run test:security; else echo "No 'test:security' script — skipping"; fi
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || '' }}
