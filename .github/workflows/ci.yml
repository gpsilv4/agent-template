name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# NOTE: Dependabot PRs run on `pull_request` with a read-only token and NO repo
# secrets (GitHub's safe default). That is fine here because no CI step below needs
# secrets. If a project's build genuinely needs secrets on Dependabot PRs, add a
# separate, carefully-scoped `pull_request_target` job at bootstrap — do not make it
# the default (it runs untrusted PR code with a privileged token).

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

# Least privilege: no job here writes to the repo.
permissions:
  contents: read

jobs:
  # Detects package.json AFTER checkout (job-level hashFiles runs before checkout and
  # is unreliable). Other jobs skip on the bare template and run on real projects.
  detect:
    name: Detect Project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_pkg: ${{ steps.check.outputs.has_pkg }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f package.json ]; then echo "has_pkg=true" >> "$GITHUB_OUTPUT"; else echo "has_pkg=false" >> "$GITHUB_OUTPUT"; fi

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect
    if: needs.detect.outputs.has_pkg == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Each step is guarded so a project WITHOUT that tool/script does not red-fail.
      # `detect` only proves package.json exists; these guards prove the specific
      # toolchain exists before running it. Remove a guard once your stack is fixed.
      - name: TypeScript
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "No tsconfig.json — skipping typecheck"; fi

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint?0:1)"; then npm run lint; else echo "No 'lint' script — skipping"; fi

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build?0:1)"; then npm run build; else echo "No 'build' script — skipping"; fi

      # Uncomment after configuring bundle targets in .agent/scripts/check-bundle-sizes.mjs
      # - name: Bundle Sizes
      #   run: node .agent/scripts/check-bundle-sizes.mjs

      # NAO por os doc guards nem o backlog aqui: este job tem
      # `if: has_pkg == 'true'` e salta num template sem app, logo eles nunca correriam.
      # Vivem no job `guard-tests`, que corre sempre.


  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect
    if: needs.detect.outputs.has_pkg == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit Tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:unit']?0:1)"; then npm run test:unit; else echo "No 'test:unit' script — skipping"; fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: needs.detect.outputs.has_pkg == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Informative, NOT a hard gate: transitive high-sev advisories are common and
      # often unfixable without a breaking bump — blocking every merge on them is a
      # footgun. Review the report; escalate to a gate (remove continue-on-error) once
      # your dependency tree is clean, or narrow with --audit-level / an allowlist.
      - name: Audit
        continue-on-error: true
        run: npm audit --audit-level=high

  # Negative tests for the guard scripts themselves. Deliberately NOT behind `detect`:
  # they need no package.json and no dependencies, and the bare template is exactly the
  # case they cover — gating them behind a package.json would mean they never run here.
  guard-tests:
    name: Guard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `fetch-depth: 0`: o check-test-surface compara contra a base do PR, e num clone
      # raso o ref da base nao existe — o verificador sai != 0 quando nao consegue medir,
      # logo um clone raso dava uma falha falsa em vez de uma medicao.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Doc guards — negative tests
        run: node .agent/scripts/test-guards.mjs
      - name: Bundle checker — negative tests
        run: node .agent/scripts/test-bundle-sizes.mjs
      - name: Backlog checker — negative tests
        run: node .agent/scripts/test-backlog.mjs
      - name: Mutation sweep — negative tests
        run: node .agent/scripts/test-mutation-sweep.mjs
      - name: Test-surface checker — negative tests
        run: node .agent/scripts/test-test-surface.mjs
      - name: Hooks — negative tests
        run: node .claude/hooks/tests/test-hooks.mjs
      - name: commit-msg hook — negative tests
        run: node .agent/scripts/test-commit-msg.mjs
      - name: Simulador de projeto derivado — negative tests
        run: node .agent/scripts/test-simulate-derived.mjs
      # A autoridade que o agente nao alcanca (AP4): se a superficie de teste encolher face a
      # base do PR, isto reprova. So em `pull_request` — e onde a base esta definida sem
      # ambiguidade (`github.event.before` vem a zeros no primeiro push de um branch).
      # Os doc guards e o backlog correm **aqui** e nao no job `quality`: aquele tem
      # `if: has_pkg == 'true'` e salta por inteiro num template sem app, logo os guards
      # ficavam testados (pelas suites acima) e nunca **aplicados**. E o mesmo padrao que o
      # `check-test-surface` tinha: documentado em todo o lado e corrido por nada. Nenhum dos
      # dois precisa de `package.json` nem de configuracao.
      - name: Doc guards — orcamento de bytes, paridades, contagens derivadas
        run: node .agent/scripts/check-doc-versions.mjs
      - name: Backlog — contadores, barra de progresso e IDs duplicados
        run: node .agent/scripts/check-backlog.mjs
      # O `commit-msg` so corre para quem tenha corrido `git config core.hooksPath .githooks`,
      # e isso e configuracao LOCAL: um clone novo, outra maquina ou outra ferramenta nao a
      # tem. Esta e a camada que nao depende dela — corre o mesmo hook sobre cada mensagem do
      # PR. E o mesmo raciocinio do `AP4`: a autoridade que o agente nao alcanca e o CI.
      - name: Mensagens de commit — sem atribuicao a IA
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"
          # `%B` e o corpo COMPLETO; um `%s` so veria o assunto e os trailers vivem no fim.
          # `-z` separa por NUL: uma mensagem tem linhas em branco, logo nao ha separador de
          # linha que sirva. Sem commits no intervalo o loop nao corre e o passo passa — e
          # correcto: um PR sem commits proprios nao existe.
          n=0
          while IFS= read -r -d '' msg; do
            printf '%s' "$msg" > /tmp/commit-msg-$n
            node .githooks/commit-msg /tmp/commit-msg-$n
            n=$((n + 1))
          done < <(git log --format='%B%x00' "$base..HEAD")
          echo "  $n mensagem(ns) verificada(s)."
          # Zero mensagens com um intervalo valido seria o AP2 ("nao ha nada" != "nao consegui
          # ler"), logo reprova em vez de passar em silencio.
          if [ "$n" -eq 0 ]; then
            echo "  Nenhuma mensagem no intervalo $base..HEAD — nao consegui verificar."
            exit 1
          fi
      # A verificacao que testa a promessa do template: montar um projeto derivado e correr la
      # tudo. Custa ~50s (copia o repo e recorre as suites), logo fica so em `pull_request` —
      # e onde vale a pena e onde alguem le o resultado. Sem isto, a unica forma de saber que
      # o template funciona num derivado era alguem lembrar-se de o experimentar.
      - name: Projeto derivado — o template funciona depois do bootstrap
        if: github.event_name == 'pull_request'
        run: node .agent/scripts/simulate-derived.mjs
      - name: Test surface — nao enfraquecida desde a base do PR
        if: github.event_name == 'pull_request'
        # `HEAD^1` e nao `base.sha`: o checkout de um PR e o **merge ref**, cujo pai 1 e a
        # base exata desse merge. Com `base.sha` (que pode estar atras da ponta do base) um
        # PR que nao tocou em testes ficava vermelho por causa de um merge feito noutro PR.
        run: node .agent/scripts/check-test-surface.mjs "$(git rev-parse HEAD^1)"
      # A varredura de mutacao recorre cada suite uma vez POR sitio de aviso (dezenas de sitios),
      # logo custa minutos, nao segundos. Fica opt-in: correr localmente apos mexer num
      # verificador. Se a quiseres no CI, descomenta e sobe o timeout-minutes deste job.
      # - name: Mutation sweep — cada aviso tem de ficar vermelho
      #   run: node .agent/scripts/mutation-sweep.mjs

  # Runs on every push/PR, including the bare template (no package.json guard):
  # scans the full history for committed secrets/keys.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action v3 lista os commits do PR (evento pull_request) via API -> precisa
    # de pull-requests: read. Permissions de job SUBSTITUEM as do topo, por isso repor
    # contents: read (checkout). (write so se quiseres comentarios inline nos achados.)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organizations (not personal repos) need a free GITLEAKS_LICENSE:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
