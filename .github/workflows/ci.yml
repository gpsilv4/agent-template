name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# NOTE: Dependabot PRs run on `pull_request` with a read-only token and NO repo
# secrets (GitHub's safe default). That is fine here because no CI step below needs
# secrets. If a project's build genuinely needs secrets on Dependabot PRs, add a
# separate, carefully-scoped `pull_request_target` job at bootstrap — do not make it
# the default (it runs untrusted PR code with a privileged token).

concurrency:
  # `pull_request.number` e nao `head.ref`: dois PRs de FORKS diferentes com o mesmo nome de
  # branch (`patch-1`, `main`) partilhavam grupo e cancelavam-se um ao outro — DoS trivial.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: no job here writes to the repo.
permissions:
  contents: read

jobs:
  # Detects package.json AFTER checkout (job-level hashFiles runs before checkout and
  # is unreliable). Other jobs skip on the bare template and run on real projects.
  detect:
    name: Detect Project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_pkg: ${{ steps.check.outputs.has_pkg }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        run: |
          # `-f package.json` so olhava para a RAIZ. Num monorepo (apps/web, packages/*,
          # frontend/) — o caso por omissao em Turborepo, pnpm workspaces e Nx — a resposta era
          # "nao ha app" e o typecheck, o lint, o build, os testes unitarios e o audit
          # deixavam de correr **para sempre, em verde**. Pior: um job `skipped` satisfaz um
          # required status check, logo o gate que o consumidor marcou como obrigatorio ficava
          # permanentemente satisfeito por nao correr.
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nao ha na raiz. Ha noutro sitio? Se ha, e um erro de configuracao e nao "nao ha app".
          outro="$(git ls-files '*package.json' | grep -v node_modules | head -3 || true)"
          if [ -n "$outro" ]; then
            echo "::error::Ha package.json fora da raiz e o CI so olha para a raiz:"
            echo "$outro" | sed 's/^/::error::  /'
            echo "::error::Apontar os jobs para essa pasta (working-directory) ou mover o package.json."
            exit 1
          fi
          # Nem na raiz nem em lado nenhum. Depois do bootstrap isso e "nao consegui medir",
          # nao "esta tudo bem" (TP2) — mas o template puro e exatamente este caso, e ai e
          # legitimo. O discriminador e a marca de bootstrap.
          if [ -f .agent/.template-version ]; then
            echo "::warning::Projeto bootstrapado sem package.json em lado nenhum — typecheck, lint, build, testes e audit NAO correm."
          fi
          echo "has_pkg=false" >> "$GITHUB_OUTPUT"

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect
    if: needs.detect.outputs.has_pkg == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # `cache: npm` ERRA (nao avisa — erra) quando nao ha lockfile. Descomentar depois
          # de commitar o `package-lock.json`, ou trocar por `cache: pnpm`/`yarn`.
          # cache: npm

      # O unico passo do pipeline que NAO estava guardado, e o primeiro a falhar: `npm ci`
      # exige lockfile por definicao. Um projeto que fez scaffold a mao e nao commitou o
      # `package-lock.json` — o caso por defeito — levava 3 jobs vermelhos com uma mensagem
      # que nao aponta para a causa. A mensagem de erro aqui aponta.
      - name: Install
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::error::package.json sem package-lock.json — corre 'npm install' e commita o lock (o CI usa 'npm ci'). Noutro gestor de pacotes, ajusta este passo e o 'cache:' acima."
            exit 1
          fi

      # Each step is guarded so a project WITHOUT that tool/script does not red-fail.
      # `detect` only proves package.json exists; these guards prove the specific
      # toolchain exists before running it. Remove a guard once your stack is fixed.
      - name: TypeScript
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "No tsconfig.json — skipping typecheck"; fi

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint?0:1)"; then npm run lint; else echo "No 'lint' script — skipping"; fi

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build?0:1)"; then npm run build; else echo "No 'build' script — skipping"; fi

      # Uncomment after configuring bundle targets in .agent/scripts/check-bundle-sizes.mjs
      # - name: Bundle Sizes
      #   run: node .agent/scripts/check-bundle-sizes.mjs

      # NAO por os doc guards nem o backlog aqui: este job tem
      # `if: has_pkg == 'true'` e salta num template sem app, logo eles nunca correriam.
      # Vivem no job `guard-tests`, que corre sempre.


  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect
    if: needs.detect.outputs.has_pkg == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # `cache: npm` ERRA (nao avisa — erra) quando nao ha lockfile. Descomentar depois
          # de commitar o `package-lock.json`, ou trocar por `cache: pnpm`/`yarn`.
          # cache: npm

      # O unico passo do pipeline que NAO estava guardado, e o primeiro a falhar: `npm ci`
      # exige lockfile por definicao. Um projeto que fez scaffold a mao e nao commitou o
      # `package-lock.json` — o caso por defeito — levava 3 jobs vermelhos com uma mensagem
      # que nao aponta para a causa. A mensagem de erro aqui aponta.
      - name: Install
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::error::package.json sem package-lock.json — corre 'npm install' e commita o lock (o CI usa 'npm ci'). Noutro gestor de pacotes, ajusta este passo e o 'cache:' acima."
            exit 1
          fi

      - name: Unit Tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:unit']?0:1)"; then npm run test:unit; else echo "No 'test:unit' script — skipping"; fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    if: needs.detect.outputs.has_pkg == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # `cache: npm` ERRA (nao avisa — erra) quando nao ha lockfile. Descomentar depois
          # de commitar o `package-lock.json`, ou trocar por `cache: pnpm`/`yarn`.
          # cache: npm

      # O unico passo do pipeline que NAO estava guardado, e o primeiro a falhar: `npm ci`
      # exige lockfile por definicao. Um projeto que fez scaffold a mao e nao commitou o
      # `package-lock.json` — o caso por defeito — levava 3 jobs vermelhos com uma mensagem
      # que nao aponta para a causa. A mensagem de erro aqui aponta.
      - name: Install
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::error::package.json sem package-lock.json — corre 'npm install' e commita o lock (o CI usa 'npm ci'). Noutro gestor de pacotes, ajusta este passo e o 'cache:' acima."
            exit 1
          fi

      # Informative, NOT a hard gate: transitive high-sev advisories are common and
      # often unfixable without a breaking bump — blocking every merge on them is a
      # footgun. Review the report; escalate to a gate (remove continue-on-error) once
      # your dependency tree is clean, or narrow with --audit-level / an allowlist.
      - name: Audit
        continue-on-error: true
        run: npm audit --audit-level=high

  # Negative tests for the guard scripts themselves. Deliberately NOT behind `detect`:
  # they need no package.json and no dependencies, and the bare template is exactly the
  # case they cover — gating them behind a package.json would mean they never run here.
  guard-tests:
    # `Guard Suites`, e nao `Guard Tests`: esse nome e o do job `guard-gate`, abaixo — o check que a
    # protecao exige (#308).
    name: Guard Suites
    runs-on: ubuntu-latest
    # Sem a varredura (#308): as suites e os verificadores, ~3 min no template e num derivado. A
    # varredura de mutacao vive no job `sweep`, em paralelo — o tecto dela e o historico dele estao la.
    timeout-minutes: 20
    steps:
      # `fetch-depth: 0`: o check-test-surface compara contra a base do PR, e num clone
      # raso o ref da base nao existe — o verificador sai != 0 quando nao consegue medir,
      # logo um clone raso dava uma falha falsa em vez de uma medicao.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # O token nao fica em `.git/config` enquanto corre codigo do PR (as suites). E so
          # `contents: read`, mas nenhum step deste job o usa: custo zero.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Doc guards — negative tests
        run: node .agent/scripts/tests/test-guards.mjs
      - name: Bundle checker — negative tests
        run: node .agent/scripts/tests/test-bundle-sizes.mjs
      - name: Backlog checker — negative tests
        run: node .agent/scripts/tests/test-backlog.mjs
      - name: Mutation sweep — negative tests
        run: node .agent/scripts/tests/test-mutation-sweep.mjs
      - name: Test-surface checker — negative tests
        run: node .agent/scripts/tests/test-test-surface.mjs
      - name: Baseline e superficie — negative tests
        run: node .agent/scripts/tests/test-baseline-superficie.mjs
      - name: Registo de suites por descoberta — negative tests
        run: node .agent/scripts/tests/test-registo.mjs
      - name: Mapa "caminho tocado -> o que o verifica" — negative tests
        run: node .agent/scripts/tests/test-mapa-suites.mjs
      - name: Detector de codigo morto — negative tests
        run: node .agent/scripts/tests/test-codigo-morto.mjs
      - name: Adocao num projeto existente (adotar-template.mjs) — negative tests
        run: node .agent/scripts/tests/test-adotar-template.mjs
      - name: Criador de Releases (release-da-tag.sh) — negative tests
        run: node .agent/scripts/tests/test-release-da-tag.mjs
      - name: Limpeza de copias em tmpdir — negative tests
        run: node .agent/scripts/tests/test-tmp-limpo.mjs
      - name: Hooks — negative tests
        run: node .claude/hooks/tests/test-hooks.mjs
      - name: commit-msg hook — negative tests
        run: node .agent/scripts/tests/test-commit-msg.mjs
      - name: Simulador de projeto derivado — negative tests
        run: node .agent/scripts/tests/test-simulate-derived.mjs
      - name: Maturidade do derivado — negative tests
        run: node .agent/scripts/tests/test-derivado-maduro.mjs
      - name: Simulador de /upgrade — negative tests
        run: node .agent/scripts/tests/test-simulate-upgrade.mjs
      # A autoridade que o agente nao alcanca (TP4): se a superficie de teste encolher face a
      # base do PR, isto reprova. So em `pull_request` — e onde a base esta definida sem
      # ambiguidade (`github.event.before` vem a zeros no primeiro push de um branch).
      # Os doc guards e o backlog correm **aqui** e nao no job `quality`: aquele tem
      # `if: has_pkg == 'true'` e salta por inteiro num template sem app, logo os guards
      # ficavam testados (pelas suites acima) e nunca **aplicados**. E o mesmo padrao que o
      # `check-test-surface` tinha: documentado em todo o lado e corrido por nada. Nenhum dos
      # dois precisa de `package.json` nem de configuracao.
      - name: Doc guards — orcamento de bytes, paridades, contagens derivadas
        run: node .agent/scripts/check-doc-versions.mjs
      - name: Backlog — contadores, barra de progresso e IDs duplicados
        run: node .agent/scripts/check-backlog.mjs
      - name: Codigo morto — imports que ninguem usa
        run: node .agent/scripts/check-codigo-morto.mjs
      # O `commit-msg` so corre para quem tenha corrido `git config core.hooksPath .githooks`,
      # e isso e configuracao LOCAL: um clone novo, outra maquina ou outra ferramenta nao a
      # tem. Esta e a camada que nao depende dela — corre o mesmo hook sobre cada mensagem do
      # PR. E o mesmo raciocinio do `TP4`: a autoridade que o agente nao alcanca e o CI.
      # SEM `if:`, e de propósito. `HEAD^1..HEAD` resolve nos dois eventos e o intervalo
      # certo em cada um:
      #   - `pull_request`: o checkout e o merge ref, cujo pai 1 e a base — logo o intervalo
      #     sao os commits do PR;
      #   - `push` para main: o pai 1 e a ponta anterior de main — logo o intervalo e o que
      #     acabou de ser integrado, seja um squash (um commit, cuja mensagem e o TITULO DO
      #     PR, editavel no momento do merge e de outra forma nunca verificado) ou um merge
      #     commit (os commits do PR).
      # Uma versao anterior tinha DOIS passos, um por evento, e o gated a `push` contava como
      # enfraquecimento no `check-test-surface` — com razao: um passo que so corre em `push`
      # deixa de correr em PRs. Um passo sem condicao nenhuma cobre mais e conta menos.
      - name: Mensagens de commit — sem atribuicao a IA
        run: |
          set -euo pipefail
          # Commit-RAIZ: um repo acabado de criar do template dispara `push` no commit
          # inicial, que nao tem pai — `git rev-parse HEAD^1` sai 128 e, com `set -e`, mata o
          # step. Resultado: o PRIMEIRO CI de cada projeto derivado nascia vermelho, por um
          # motivo que nao e culpa de quem clona. Isto nao e o TP2: nao e "nao consegui ler",
          # e "provei que nao ha intervalo".
          if ! base="$(git rev-parse --verify --quiet HEAD^1)"; then
            echo "  HEAD e um commit-raiz (repo novo) — nao ha intervalo a verificar."
            exit 0
          fi
          # `%B` e o corpo COMPLETO; um `%s` so veria o assunto e os trailers vivem no fim.
          # `-z` separa por NUL: uma mensagem tem linhas em branco, logo nao ha separador de
          # linha que sirva. `--no-merges`: o checkout de um PR e o merge ref, logo sem ele o
          # commit de merge gerado pelo GitHub entrava SEMPRE e a contagem dizia mais uma do
          # que o PR tem — e o ramo `n -eq 0` ficava inalcancavel (TP7).
          n=0
          while IFS= read -r -d '' msg; do
            # `RUNNER_TEMP` e nao `/tmp`: num runner self-hosted (que qualquer derivado pode
            # adoptar) `/tmp/commit-msg-N` e um caminho previsivel, partilhado entre jobs.
            # `</dev/null`: o `node` herdava o stdin do `while read` — hoje o hook nao le
            # stdin, mas e a classe de bug que so aparece quando alguem lho acrescenta.
            msgfile="$RUNNER_TEMP/commit-msg-$n"
            printf '%s' "$msg" > "$msgfile"
            node .githooks/commit-msg "$msgfile" </dev/null
            n=$((n + 1))
          done < <(git log --no-merges --format='%B%x00' "$base..HEAD")
          echo "  $n mensagem(ns) verificada(s)."
          # Zero mensagens com um intervalo valido seria o TP2 ("nao ha nada" != "nao consegui
          # ler"), logo reprova em vez de passar em silencio.
          if [ "$n" -eq 0 ]; then
            echo "  Nenhuma mensagem no intervalo $base..HEAD — nao consegui verificar."
            exit 1
          fi
      - name: Test surface — nao enfraquecida desde a base do PR
        if: github.event_name == 'pull_request'
        # `HEAD^1` e nao `base.sha`: o checkout de um PR e o **merge ref**, cujo pai 1 e a
        # base exata desse merge. Com `base.sha` (que pode estar atras da ponta do base) um
        # PR que nao tocou em testes ficava vermelho por causa de um merge feito noutro PR.
        run: node .agent/scripts/check-test-surface.mjs "$(git rev-parse HEAD^1)"

  # A VARREDURA DE MUTACAO num job proprio (#308, R7B-8), com as pernas em paralelo: a completa
  # (cada `warn()`/`fatal()`) e a `--skips` (cada `skip()`/`note()`, #192). Corriam em SERIE no
  # `guard-tests`, depois das suites: num derivado privado (2 vCPU) o job chegou aos 51 dos 75 min
  # (os tempos vivem SO no cabecalho do `mutation-sweep.mjs`, `TP8`). Em paralelo, o tempo de parede
  # e o da perna maior.
  #
  # Ficou no `guard-tests` no #158 de proposito ("move-la poria a correr DUAS vezes num derivado que
  # ja a tem"). O que mudou: a 2b compara job a job (`comandosPorJob`), e o `check-test-surface`
  # reprova os estados maus de um derivado (a varredura em dois jobs, ou fora de um agregador; um
  # `needs:` partido; dois checks com o mesmo nome) — `src/docs/upgrade-why.md`, #308.
  #
  # A MESMA condicao para todas as pernas, num passo so: uma matriz, e nao dois jobs com a condicao
  # copiada (`TP8`). `fail-fast: false`: uma perna vermelha nao cancela a outra a meio da medicao.
  #
  # O CUSTO num privado (minutos faturados, cada job arredonda ao minuto): as pernas fazem
  # checkout e setup em TODO o PR, mesmo quando a condicao diz "nao aplicavel", e o `guard-gate`
  # corre sempre — o custo por PR esta no paragrafo dos SHARDS, abaixo (um numero so, `TP8`). Num publico nao se
  # paga. O ganho e o tempo de parede de um PR que toca nos verificadores.
  #
  # A PERNA COMPLETA EM SHARDS (#308, o desenho do #159): `shard: [1, 2]` reparte os sitios por duas
  # maquinas (`SWEEP_SHARD=k/n`, `lib/varredura-fatia.mjs`), em TODO o repo — num publico e gratis, e
  # assim o template corre o mesmo caminho que um derivado privado. O `de` diz quantos shards ha; o
  # `guard-gate` confere os relatorios de todos (`lib/varredura-shards.mjs`): um shard que saia da
  # lista, ou um `de` que nao bata com ela, reprova ali, e nao fica verde com sitios por medir.
  # Num privado: ~+4-6 min faturados por PR (baselines e provas repetidas por maquina), contra
  # metade do tempo de parede da perna completa.
  sweep:
    name: Mutation sweep (${{ matrix.modo }} ${{ matrix.shard }}/${{ matrix.de }})
    runs-on: ubuntu-latest
    # Depois das SUITES: com elas vermelhas o gate ja esta condenado, e as pernas faturavam ~40
    # min num privado a medir para nada (antes, um passo vermelho saltava o da varredura). Custa ~3
    # min de parede; o paralelismo das pernas, que e o ganho, fica.
    needs: guard-tests
    # Tambem ao nivel do JOB: num `push` o job arrancava, fazia o checkout e ficava VERDE sem ter
    # medido nada (`TP2`). Assim aparece como `skipped`.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        modo: [completa]
        shard: [1, 2]
        include:
          - modo: completa
            de: 2
          - modo: skips
            shard: 1
            de: 1
    # 75 (a perna completa; a `--skips` cabe folgada), e o numero vem de MEDICOES sucessivas e nao de um palpite. O historico e o que
    # interessa aqui, porque mostra uma TENDENCIA e nao um valor:
    #
    #   PR #36   20m29s   primeira corrida com a varredura ligada
    #   PR #47   39m09s   depois de o template ganhar guards e suites
    #   PR #56   >40m     **morreu no tecto de 40** — 163 sitios, e a medir ainda
    #
    # O comentario anterior dizia "cada verificador novo empurra isto para cima" e
    # "sobe-se antes de doer, nao depois". Doeu: o job foi cancelado a meio da varredura e o
    # PR ficou bloqueado por **falta de tempo**, nao por defeito. E o pior modo de falha
    # possivel — parece um erro e nao e.
    #
    # 75 nao e generosidade: a varredura cresce com o produto (sitios x tamanho das suites), e
    # cada teste novo no `test-guards` multiplica-se pelos sitios dele. A margem que conta e a
    # de um derivado PRIVADO (2 vCPU, metade do runner deste repo). Os tempos atuais, por
    # visibilidade e com o `n`, vivem SO no cabecalho do `mutation-sweep.mjs` (`TP8`: um numero
    # medido escrito em dois sitios envelhece num deles — este comentario ja o provou).
    #
    # O `--diff` (varrer so os alvos tocados) existe, mas e so LOCAL, por decisao (#57): o CI e
    # o portao e varre tudo. O que encurta o portao sem medir menos esta no plano do #161; ate
    # la, o tecto e que segura isto, e um tecto apertado transforma crescimento em CI vermelho.
    #
    timeout-minutes: 75
    steps:
      # `fetch-depth: 0`: a condicao compara contra a base do PR (`HEAD^1`).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # O token nao fica em `.git/config` enquanto corre codigo do PR (a varredura).
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # A varredura de mutacao recorre cada suite uma vez POR sitio de aviso (quantos: `--list`),
      # logo custa minutos, nao segundos. Estava COMENTADA — o instrumento que prova que as
      # suites afirmam algo era o unico verificador que nao corria automaticamente em lado
      # nenhum, e a regra "cada verificador tem a sua suite" ficava em "corre se te lembrares".
      # Corre onde e relevante: quando o PR toca nos verificadores ou nos hooks.
      - name: Mutation sweep — cada aviso tem de ficar vermelho
        env:
          MODO: ${{ matrix.modo }}
          # O shard vai por ambiente e nao por `--shard`: o comando fica o de sempre (e o do `allow`).
          SWEEP_SHARD: ${{ matrix.shard }}/${{ matrix.de }}
          # A prova deste shard para o `guard-gate`: escrita em TODOS os ramos (mesmo "nao aplicavel"),
          # porque um relatorio em falta e o que o portao reprova.
          SWEEP_RELATORIO: ${{ runner.temp }}/varredura/${{ matrix.modo }}-${{ matrix.shard }}.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SWEEP_RELATORIO")"
          nao_aplicavel() { printf '{"modo":"%s","k":%s,"n":%s,"aplicavel":false}\n' "$MODO" "${SWEEP_SHARD%/*}" "${SWEEP_SHARD#*/}" > "$SWEEP_RELATORIO"; }
          # Commit-RAIZ. AQUI, com o `if: pull_request` acima, este ramo nao corre (o merge ref
          # de um PR tem sempre pai) — e fica de proposito, nao por copia: um derivado que tire o
          # `if:` para varrer tambem em `push` corre-o no commit inicial do repo. Medido: o
          # `referee-exam-study` fez exatamente isso. Sem o ramo, `git rev-parse HEAD^1` sai 128,
          # o `set -e` mata o step e o PRIMEIRO CI desse derivado nasce vermelho. Nao e o `TP2`:
          # e "provei que nao ha intervalo", nao "nao consegui ler".
          if ! base="$(git rev-parse --verify --quiet HEAD^1)"; then
            echo "  HEAD e um commit-raiz (repo novo) — nao ha intervalo a verificar."
            nao_aplicavel
            exit 0
          fi
          # SEM PIPE, e de proposito. Com `pipefail`, `git diff | grep -q` caia no `else` em
          # VERDE por dois caminhos: um `git diff` que falha, e o SIGPIPE que o `grep -q` provoca
          # ao sair no primeiro match com o escritor ainda a escrever — "nao aplicavel"
          # precisamente quando havia match (TP11). Trocar o `git diff` por `printf "$x" |` NAO
          # resolve: o builtin corre num subshell do pipe e leva o mesmo SIGPIPE (medido, #155).
          # Capturar isola a falha do `git diff` (`set -e` mata o step); o here-string tira o
          # pipe; e o exit 2 do `grep` (erro) deixa de se confundir com o 1 (sem match).
          tocados="$(git diff --name-only "$base..HEAD")"
          rc=0
          grep -qE '^(\.agent/scripts/|\.claude/hooks/|\.githooks/)' <<<"$tocados" || rc=$?
          if [ "$rc" -eq 0 ] && [ "$MODO" = completa ]; then
            node .agent/scripts/mutation-sweep.mjs
          elif [ "$rc" -eq 0 ] && [ "$MODO" = skips ]; then
            # Os `skip()`/`note()`, completos (#192): um guard que deixa de dizer que nao correu e o
            # `TP2`. Completos e nao `--diff`: o portao nao depende do mapa.
            node .agent/scripts/mutation-sweep.mjs --skips
          elif [ "$rc" -eq 0 ]; then
            echo "::error::modo da matriz desconhecido: '$MODO' — nao sei que varredura correr."
            exit 1
          elif [ "$rc" -eq 1 ]; then
            echo "Nenhum verificador/hook tocado neste PR — varredura nao aplicavel."
            nao_aplicavel
          else
            echo "::error::grep saiu $rc a decidir se a varredura se aplica — nao consegui decidir."
            exit 1
          fi
      # So num shard verde (o passo de cima falhou e este nao corre): vermelho, o portao ja reprova pelo
      # `needs.sweep.result`. Sem `if: always()` de proposito — uma condicao num passo e marca no
      # `check-test-surface`, e aqui nao compraria nada.
      - name: Relatorio do shard para o portao
        uses: actions/upload-artifact@v7
        with:
          name: varredura-${{ matrix.modo }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/varredura/${{ matrix.modo }}-${{ matrix.shard }}.json
          if-no-files-found: error
          # Um re-run do shard volta a carregar o mesmo nome; 7 dias deixam o portao ser re-corrido.
          overwrite: true
          retention-days: 7

  # O CHECK QUE A PROTECAO EXIGE (#308). Um ruleset ou uma branch protection exige checks pelo NOME,
  # e o deste repo exige `Guard Tests` (medido: ruleset `main`, 2026-10-13). Com a varredura num job
  # seu, `Guard Tests` deixava de a incluir — um PR com a varredura vermelha passava a poder ser
  # mergeado, sem nenhuma definicao mudada. Este job tem o nome antigo e so fica verde com as suites
  # verdes E a varredura verde (ou saltada: so corre em `pull_request`, e num PR que nao toca nos
  # verificadores as pernas saem verdes sem medir). Assim nenhum repo — este, ou um derivado com a
  # protecao ligada — precisa de mudar as definicoes. Num privado de conta free a protecao nao e
  # imposta (`src/docs/github-security.md`): ai e so o semaforo. O required e SO este nome: os das
  # pernas (`Mutation sweep (completa 1/2)`, ...) nao sao estaveis num `push` (saltadas, sem expandir).
  #
  # NAO espera pelo `simulators`: o bootstrap remove esse job num derivado, e um `needs:` para um job
  # que nao existe invalida o workflow inteiro.
  guard-gate:
    name: Guard Tests
    runs-on: ubuntu-latest
    needs: [guard-tests, sweep]
    # `always()`: sem ele, uma dependencia vermelha SALTAVA este job — e um check saltado conta como
    # passado para a protecao.
    if: always()
    timeout-minutes: 5
    steps:
      # Os SHARDS (#308): cada um so ve a sua fatia, logo "todos verdes" nao prova que TODOS correram —
      # um tirado da matriz deixava sitios por medir com o resto verde. Os relatorios deles juntos
      # provam-no (`lib/varredura-shards.mjs`): indices 1..n, o mesmo total, e a soma dos medidos.
      # Os tres passos correm SEMPRE, sem `if:` (uma condicao num passo do portao e marca no
      # `check-test-surface`): sem relatorios (um `push`), o download por `pattern` traz zero
      # ficheiros e passa; e o passo de baixo que decide se os confere.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: varredura-*
          merge-multiple: true
          path: ${{ runner.temp }}/varredura
      - name: Suites e varredura verdes, e todos os shards mediram
        env:
          SUITES: ${{ needs.guard-tests.result }}
          VARREDURA: ${{ needs.sweep.result }}
          EVENTO: ${{ github.event_name }}
        run: |
          echo "  suites: $SUITES · varredura: $VARREDURA"
          if [ "$SUITES" != success ]; then
            echo "::error::as suites (Guard Suites) nao passaram: $SUITES"
            exit 1
          fi
          # `skipped` so FORA de um `pull_request` (o job `sweep` e so de PR: num `push`, num `merge_group`
          # ou num `workflow_dispatch` que um derivado acrescente, salta). Num PR, saltada e "nao
          # mediu": se o `if:` do `sweep` ficar mais estreito, o gate nao fica verde por isso (`TP2`).
          # Qualquer outro estado (`failure`, `cancelled`) reprova.
          if [ "$VARREDURA" = success ]; then
            node .agent/scripts/lib/varredura-shards.mjs "$RUNNER_TEMP/varredura"
            exit $?
          fi
          if [ "$VARREDURA" = skipped ] && [ "$EVENTO" != pull_request ]; then
            exit 0
          fi
          echo "::error::a varredura de mutacao nao passou ($EVENTO): $VARREDURA"
          exit 1

  # Os dois SIMULADORES num job proprio (#158), em paralelo com o `guard-tests`: ~4 min que
  # corriam em serie ANTES da varredura, e nao dependem dela nem ela deles. Sao so do template —
  # num projeto derivado dao `SKIP` em segundos —, logo um derivado que os tenha ainda no seu
  # `guard-tests` paga segundos, nao minutos (o `upgrade.md` manda tira-los de la, e o
  # `BOOTSTRAP.md` remove ESTE job num derivado novo — la ficava verde sem medir). A varredura
  # tem o job dela, `sweep` (#308).
  simulators:
    name: Simuladores
    runs-on: ubuntu-latest
    # Tambem ao nivel do JOB, e nao so nos passos: num `push` o job arrancava, fazia o checkout
    # completo e o setup, saltava os dois passos e ficava VERDE sem ter medido nada (`TP2`). Assim
    # aparece como `skipped`, que e o que aconteceu.
    if: github.event_name == 'pull_request'
    # 30 da ~2x sobre o que os passos medem num PR de maquinaria, que e o mais longo: com a `--skips`
    # do derivado maduro (#308, parte 3) o job chega aos ~13-17 min, e os 15 de antes nao davam folga
    # (o tempo de cada passo esta no comentario dele, e nao repetido aqui — `TP8`).
    timeout-minutes: 30
    steps:
      # `fetch-depth: 0`: o `simulate-upgrade` monta um derivado da ULTIMA TAG, e um clone raso
      # nao as traz — ele reprova a dizer que nao mediu, em vez de passar em silencio.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # A verificacao que testa a promessa do template: montar um projeto derivado e correr la
      # tudo. Custa cerca de um minuto (copia o repo e recorre as suites), logo fica so em `pull_request` —
      # e onde vale a pena e onde alguem le o resultado. Sem isto, a unica forma de saber que
      # o template funciona num derivado era alguem lembrar-se de o experimentar.
      # E, num PR que toca na maquinaria, a `--skips` sobre o derivado MADURO (#308, parte 3): o R7B-7
      # so apareceu no CI de um derivado, porque nenhum CI do template a corria sobre um derivado com
      # historia. A MESMA condicao da varredura (sem o pipe, `TP11`); por `SIMULATE_SKIPS` e nao por
      # flag, para o comando ser o do `allow`. ~+8 min neste job, em paralelo com o `Guard Tests`.
      - name: Projeto derivado — o template funciona depois do bootstrap
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          tocados="$(git diff --name-only "$(git rev-parse HEAD^1)..HEAD")"
          rc=0
          grep -qE '^(\.agent/scripts/|\.claude/hooks/|\.githooks/)' <<<"$tocados" || rc=$?
          if [ "$rc" -eq 0 ]; then
            export SIMULATE_SKIPS=1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::grep saiu $rc a decidir se a --skips do derivado se aplica — nao consegui decidir."
            exit 1
          fi
          node .agent/scripts/simulate-derived.mjs
      # A OUTRA metade da promessa: o template tambem serve para ATUALIZAR projetos que ja
      # existem, e essa metade nao tinha rede nenhuma ate agora. Monta um derivado da ultima
      # tag, aplica o upgrade e mede — a FASE 1 dele imprime o que este PR faz reprovar num
      # consumidor, que e informacao que ninguem mais produz.
      #
      # Sem filtro por caminho, e de proposito: o que isto apanha e "o template partiu os
      # consumidores", e quase qualquer alteracao pode causa-lo — uma rule, um limiar, um
      # workflow. Restringir o gatilho obrigava a adivinhar quais, que e o mesmo filtro
      # fragil que ja foi recusado para a varredura.
      #
      # Precisa das tags, que o `fetch-depth: 0` deste job traz. Num clone raso ele REPROVA a
      # dizer que nao mediu, em vez de passar em silencio.
      - name: Projeto ja existente — o /upgrade nao parte um consumidor
        if: github.event_name == 'pull_request'
        run: node .agent/scripts/simulate-upgrade.mjs

  # Runs on every push/PR, including the bare template (no package.json guard):
  # scans the full history for committed secrets/keys.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action v3 lista os commits do PR (evento pull_request) via API -> precisa
    # de pull-requests: read. Permissions de job SUBSTITUEM as do topo, por isso repor
    # contents: read (checkout). (write so se quiseres comentarios inline nos achados.)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # A `gitleaks-action` exige `GITLEAKS_LICENSE` em contas de ORGANIZACAO (gratis, mas por
      # formulario externo); so contas pessoais estao isentas. Sem isso, quem clonar este
      # template para um repo de org fica com o UNICO job que corre sempre — e o unico que nao
      # depende do `detect` — vermelho no dia 1, por um motivo que nao e do codigo dele.
      #
      # Este passo transforma isso num aviso accionavel em vez de uma falha opaca. Nao salta a
      # varredura: se a licenca existir, corre na mesma.
      # A condicao vive no SHELL e nao num `if:` de step. Nao e estilo: o
      # `check-test-surface.mjs` conta os `if:` como marcas de enfraquecimento, e tem razao em
      # o fazer — um `if:` e a forma mais barata de desligar uma verificacao sem a apagar.
      # Este seria benigno (condiciona um aviso, nao uma verificacao), mas um gate que precisa
      # de saber distinguir os benignos deixa de ser util. Escrever a condicao no `run:` da o
      # mesmo resultado sem gastar a marca.
      - name: Licenca do gitleaks (so em organizacoes)
        env:
          DONO: ${{ github.event.repository.owner.type }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: |
          if [ "$DONO" = "Organization" ] && [ -z "${GITLEAKS_LICENSE:-}" ]; then
            echo "::warning::Repo de ORGANIZACAO sem GITLEAKS_LICENSE. A gitleaks-action pede licenca (gratis) para orgs — o passo seguinte vai falhar."
            echo "::warning::Obter em https://gitleaks.io e guardar como secret GITLEAKS_LICENSE, ou trocar este job por gitleaks em binario."
            echo "::warning::Governance: a gitleaks-action e licenca comercial desde a v2 e valida a licenca contra um terceiro."
          fi

      - name: Gitleaks
        # Pin por SHA, e nao pela tag `v3`: uma tag e MOVEL — quem a controla pode reaponta-la,
        # e esta acao corre em cada PR com acesso ao repo. As de `actions/*` ficam por tag (o
        # owner e o mesmo do runner); as de terceiros, nao. O Dependabot atualiza SHAs e mantem
        # o comentario da versao ao lado.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTA para quem vir o aviso do editor: a extensao GitHub Actions do VS Code marca
          # estas duas linhas com "Context access might be invalid: GITLEAKS_LICENSE". E
          # ESPERADO — ela avisa sempre que nao consegue confirmar que um secret existe, e este
          # e opcional por desenho. Nao e erro de CI: o job passa sem o secret definido.
          #
          # NAO HA COMO SILENCIAR, e nao vale a pena procurar: a supressao por linha ou por
          # ficheiro e um pedido em aberto na extensao (github/vscode-github-actions#123), e a
          # propria classe de falso positivo esta reportada (#222, #533). Os workarounds que se
          # encontram — fazer login, recarregar a janela — servem para ela ENCONTRAR o secret, e
          # aqui nao ha nenhum para encontrar.
          #
          # O aviso ate diz uma coisa verdadeira: "estas num repo PESSOAL". Num derivado que
          # viva numa ORGANIZACAO o secret passa a existir, porque e la que a acao o exige — e
          # ai desaparece sozinho.
          #
          # Organizacoes (nao repos pessoais) precisam de GITLEAKS_LICENSE, gratis. Fica
          # DESCOMENTADO: sem secret definido o valor e vazio e a acao comporta-se como antes;
          # com secret, funciona. Comentado, nem definir o secret resolvia — e o aviso acima
          # mandava fazer uma coisa que nao tinha efeito.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
